<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume — Ben Rice</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
    .site-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:1.75rem clamp(1.5rem,4vw,4rem)}
    .site-header .logo{justify-self:start;font-family:'Krona One',sans-serif;font-size:1.6rem;line-height:1;color:#1a1a1a;text-decoration:none;transition:color .25s ease}
    .site-header .logo:hover{color:#f97316}
    .top-nav{justify-self:center;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.85rem;font-size:.7rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
    .top-nav a{color:#1a1a1a;text-decoration:none;transition:color .25s ease;white-space:nowrap}
    .top-nav a:hover{color:#f97316}
    .top-nav .sep{color:#d1d5db}
    @media(max-width:48rem){.site-header{grid-template-columns:1fr;gap:1.25rem}.site-header .logo{justify-self:center}.top-nav{justify-self:center;font-size:.65rem;gap:.7rem}}
    </style>
</head>
<body class="overflow-x-hidden min-h-screen flex flex-col">

    <!-- navbar -->
    <header class="site-header">
    <a href="/index.html" class="logo">bR</a>
    <nav class="top-nav" aria-label="Explore">
    <a href="/projects/">Things I'm tinkering with</a><span class="sep" aria-hidden="true">/</span><a href="/blog/">Writing to myself</a><span class="sep" aria-hidden="true">/</span><a href="/knowledge/">Knowledge for all</a><span class="sep" aria-hidden="true">/</span><a href="/cool/">Things I find cool</a><span class="sep" aria-hidden="true">/</span><a href="/resume/">Resume</a>
    </nav>
    </header>

    <main class="flex-1">
        <!-- title -->
        <section class="max-w-7xl mx-auto px-6 sm:px-16 md:px-32 pt-16 md:pt-24 pb-10 flex flex-col md:flex-row md:items-end md:justify-between gap-6">
            <div>
                <p class="reveal font-KronaOne text-orange-500 text-xs md:text-sm tracking-[0.3em] uppercase mb-4">Resume</p>
                <h1 class="reveal font-KronaOne text-[clamp(1.75rem,4.5vw,2.75rem)] leading-tight max-w-2xl">The paper version of everything else on this site.</h1>
            </div>
            <a href="/BenjaminRiceResume.pdf" download class="reveal shrink-0 inline-flex items-center gap-2 bg-black text-white font-KronaOne text-sm px-6 py-3 rounded-full hover:bg-orange-500 transition-colors">
                <i class="fa-solid fa-download"></i> Download PDF
            </a>
        </section>

        <!-- embedded resume -->
        <section class="max-w-7xl mx-auto px-6 sm:px-16 md:px-32 pb-24">
            <div class="reveal border border-gray-200 rounded-2xl overflow-hidden bg-gray-50" style="aspect-ratio: 8.5 / 11; max-height: 85vh;">
                <object data="/BenjaminRiceResume.pdf" type="application/pdf" class="w-full h-full">
                    <div class="flex flex-col items-center justify-center h-full text-center p-10 text-gray-500">
                        <p class="mb-4">Your browser won't preview PDFs inline.</p>
                        <a href="/BenjaminRiceResume.pdf" target="_blank" class="text-orange-500 underline">Open the resume directly</a>
                    </div>
                </object>
            </div>
        </section>
    </main>

    <footer class="px-6 sm:px-10 md:px-14 py-6 border-t border-gray-200 flex flex-col md:flex-row justify-between items-center gap-3 text-xs text-gray-400 font-KronaOne">
        <p>bR 2026 - All rights reserved</p>
        <div class="flex items-center gap-4 text-base">
            <a target="_blank" href="https://github.com/bendrice" aria-label="GitHub" class="hover:text-orange-500 transition-colors"><i class="fab fa-github"></i></a>
            <a target="_blank" href="https://www.linkedin.com/in/benjamind-rice/" aria-label="LinkedIn" class="hover:text-orange-500 transition-colors"><i class="fa-brands fa-linkedin"></i></a>
            <a href="/resume/" aria-label="Resume" class="hover:text-orange-500 transition-colors"><i class="fa-solid fa-file"></i></a>
            <a href="mailto:rice.be@northeastern.edu" aria-label="Email" class="hover:text-orange-500 transition-colors"><i class="fa-solid fa-envelope"></i></a>
        </div>
    </footer>

    <script src="/js/main.js"></script>
