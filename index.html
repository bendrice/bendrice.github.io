<style>:root{--ink:#1a1a1a;--ink-soft:#4b5563;--ink-faint:#9ca3af;--orange:#f97316;--rule:#f3f4f6}html,body{margin:0;padding:0}body.home{background:#fff;color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}.site-header{padding:2rem clamp(1.5rem,4vw,4rem) 0}.site-header .logo{font-family:'Krona One',sans-serif;font-size:2.25rem;line-height:1;color:var(--ink);text-decoration:none;transition:color .25s ease}.site-header .logo:hover{color:var(--orange)}.hero{flex:1;width:100%;padding:3rem clamp(1.5rem,4vw,4rem) 5rem}.hero-grid{display:grid;grid-template-columns:auto auto;gap:clamp(2rem,4vw,5rem);align-items:start}.hero-left{min-width:0}.eyebrow{font-family:'Krona One',sans-serif;color:var(--orange);font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;margin:0 0 1.25rem}.headline{position:relative;z-index:2;font-family:'Krona One',sans-serif;font-size:clamp(3rem,6vw,5.5rem);line-height:.98;margin:0 clamp(-9rem,-7vw,-4rem) 1.5rem 0;font-weight:400;white-space:nowrap}.blink-dot{color:var(--orange);animation:home-blink 1.2s steps(2,start) infinite}@keyframes home-blink{to{visibility:hidden}}.photo-wrap{position:relative;z-index:1;margin:0;min-width:0}.photo-wrap img{display:block;width:auto;max-height:70vh;object-fit:contain;background:#f3f4f6}.location{margin:0;font-size:.95rem;letter-spacing:.02em;color:var(--ink-faint)}.stack-nav{display:flex;flex-direction:column;gap:.5rem;margin:2.75rem 0 0;min-width:0}.stack-nav a{display:inline-block;font-size:1.25rem;font-weight:600;color:var(--ink);text-decoration:none;padding-left:1.25rem;border-left:2px solid var(--rule);transition:color .25s ease,border-color .25s ease,transform .25s ease}.stack-nav a:hover{color:var(--orange);border-left-color:var(--orange);transform:translateX(6px)}.site-footer{padding:1.5rem clamp(1.5rem,4vw,4rem);border-top:1px solid var(--rule);display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:.75rem;font-size:.75rem;color:var(--ink-faint);font-family:'Krona One',sans-serif}.site-footer p{margin:0}.site-footer .icons{display:flex;align-items:center;gap:1rem;font-size:1rem}.site-footer .icons a{color:var(--ink-faint);transition:color .25s ease}.site-footer .icons a:hover{color:var(--orange)}@media(max-width:60rem){.hero{padding:2.5rem 1.75rem 3.5rem}.site-header{padding:1.75rem 1.75rem 0}.hero-grid{grid-template-columns:1fr;gap:2.5rem}.headline{white-space:normal;margin-right:0}.photo-wrap{max-width:26rem}.photo-wrap img{width:100%;height:auto;max-height:none}.stack-nav{margin-top:2rem}}@media(max-width:40rem){.site-footer{flex-direction:column}}</style>
</head>
